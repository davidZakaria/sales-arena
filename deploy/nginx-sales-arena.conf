# Nginx site for sales-arena (port 3005 upstream)
# Install:
#   sudo cp deploy/nginx-sales-arena.conf /etc/nginx/sites-available/sales-arena
#   sudo ln -sf /etc/nginx/sites-available/sales-arena /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS (after HTTP works):
#   sudo certbot --nginx -d sales-arena.duckdns.org

server {
    listen 80;
    server_name sales-arena.duckdns.org;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }
}
